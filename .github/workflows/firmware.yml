name: Firmware CI

# Compile check for both sketches. Releases are published by release.yml.
on:
  push:
    paths:
      - 'firmware/**'
      - 'firmware-rl/**'
  pull_request:
    paths:
      - 'firmware/**'
      - 'firmware-rl/**'

jobs:
  compile:
    name: Compile ${{ matrix.sketch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [firmware, firmware-rl]

    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: arduino-cli lib install "WebSockets" "ArduinoJson"

      - name: Create secrets.h for CI
        run: cp ${{ matrix.sketch }}/include/secrets.h.example ${{ matrix.sketch }}/include/secrets.h

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=huge_app \
            --output-dir build \
            ${{ matrix.sketch }}/
